name: sherise_mobile
description: SheRise - Women Empowerment Platform

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.0

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # UI
  pinput: ^4.0.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Location
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.0

  # Notifications
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10

  # File Handling
  image_picker: ^1.0.7

  # Utilities
  intl: ^0.19.0
  app_links: ^6.0.0
  url_launcher: ^6.2.2
  webview_flutter: ^4.10.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

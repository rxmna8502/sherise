name: SheRise CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f SheRise_Web/requirements.txt ]; then pip install -r SheRise_Web/requirements.txt; fi
        
    - name: Check Syntax (Basic Linting)
      run: |
        pip install flake8
        flake8 SheRise_Web --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 SheRise_Web --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
